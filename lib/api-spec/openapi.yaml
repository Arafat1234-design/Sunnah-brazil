openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: OpenShelf digital library API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: library
    description: Public library discovery
  - name: books
    description: Book catalog
  - name: videos
    description: Video catalog
  - name: images
    description: Public image gallery
  - name: categories
    description: Content categories
  - name: events
    description: Public events and announcements
  - name: admin
    description: Protected administration
  - name: storage
    description: App Storage uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /library/summary:
    get:
      operationId: getLibrarySummary
      tags: [library]
      summary: Get the public library summary
      responses:
        "200":
          description: Featured and recently added content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySummary"
  /books:
    get:
      operationId: listBooks
      tags: [books]
      summary: Search and filter books
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Category"
      responses:
        "200":
          description: Matching books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
    post:
      operationId: createBook
      tags: [admin]
      summary: Add a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "201":
          description: Created book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /books/{id}:
    get:
      operationId: getBook
      tags: [books]
      summary: Get book details
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateBook
      tags: [admin]
      summary: Update a book
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBook
      tags: [admin]
      summary: Remove a book
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Book removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /books/{id}/download:
    get:
      operationId: getBookDownload
      tags: [books]
      summary: Get a book PDF download URL
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /books/{id}/read/file:
    get:
      operationId: readBookFile
      tags: [books]
      summary: Read a book inline in the app
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: PDF file rendered inline
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The source file could not be prepared
  /books/{id}/download/file:
    get:
      operationId: downloadBookFile
      tags: [books]
      summary: Download a book as a PDF attachment
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The source file could not be prepared
  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: Search and filter videos
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Category"
      responses:
        "200":
          description: Matching videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
    post:
      operationId: createVideo
      tags: [admin]
      summary: Add a video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoInput"
      responses:
        "201":
          description: Created video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get video details
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Video details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateVideo
      tags: [admin]
      summary: Update a video
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUpdate"
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteVideo
      tags: [admin]
      summary: Remove a video
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Video removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /images:
    get:
      operationId: listImages
      tags: [images]
      summary: Search and filter gallery images
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Category"
      responses:
        "200":
          description: Matching gallery images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Image"
    post:
      operationId: createImage
      tags: [admin]
      summary: Add an image to the gallery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageInput"
      responses:
        "201":
          description: Created gallery image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin access required
  /images/{id}:
    get:
      operationId: getImage
      tags: [images]
      summary: Get a gallery image
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Gallery image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateImage
      tags: [admin]
      summary: Update a gallery image
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUpdate"
      responses:
        "200":
          description: Updated gallery image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin access required
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteImage
      tags: [admin]
      summary: Remove a gallery image
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Gallery image removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin access required
        "404":
          $ref: "#/components/responses/NotFound"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List published events
      responses:
        "200":
          description: Published events, with upcoming events first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [admin]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event details
        "403":
          description: Admin password required
  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a published event
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEvent
      tags: [admin]
      summary: Update an event
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event details
        "403":
          description: Admin password required
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteEvent
      tags: [admin]
      summary: Delete an event
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Event deleted
        "403":
          description: Admin password required
        "404":
          $ref: "#/components/responses/NotFound"
  /events/{id}/duplicate:
    post:
      operationId: duplicateEvent
      tags: [admin]
      summary: Duplicate an event as an unpublished draft
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Duplicated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "403":
          description: Admin password required
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [admin]
      summary: List all events for administration
      responses:
        "200":
          description: All events including drafts and past events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "403":
          description: Admin password required
  /videos/{id}/download:
    get:
      operationId: getVideoDownload
      tags: [videos]
      summary: Get a permitted MP4 download URL
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResponse"
        "403":
          description: Downloads are disabled
  /videos/{id}/download/file:
    get:
      operationId: downloadVideoFile
      tags: [videos]
      summary: Download a video as an MP4 attachment
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: MP4 video file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "403":
          description: Downloads are disabled
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The source video could not be prepared
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List content categories
      responses:
        "200":
          description: Categories with content counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get catalog and engagement statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /analytics/events:
    post:
      operationId: trackAnalyticsEvent
      tags: [analytics]
      summary: Record an anonymous pageview or content event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventInput"
      responses:
        "202":
          description: Event accepted
        "400":
          description: Invalid analytics event
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get privacy-conscious dashboard analytics
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, 7d, 30d, 90d, 12m, custom]
            default: 7d
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin access required
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check the additional Admin password session
      responses:
        "200":
          description: Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin access required
        "503":
          description: Admin password is not configured
    post:
      operationId: unlockAdminAccess
      tags: [admin]
      summary: Unlock the Admin workspace with the additional password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordInput"
      responses:
        "200":
          description: Admin access unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessStatus"
        "401":
          description: Invalid Admin password
        "403":
          description: Admin access required
        "503":
          description: Admin password is not configured
    delete:
      operationId: lockAdminAccess
      tags: [admin]
      summary: Lock the additional Admin password session
      responses:
        "204":
          description: Admin access locked
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Presigned upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid or unsupported file
        "401":
          $ref: "#/components/responses/Unauthorized"
  /images/upload-url:
    post:
      operationId: requestImageUploadUrl
      tags: [admin]
      summary: Request an image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Presigned image upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid or unsupported image
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin access required
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    Category:
      name: category
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
  responses:
    Unauthorized:
      description: Authentication required
    NotFound:
      description: Resource not found
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Book:
      type: object
      required: [id, title, author, description, category, coverUrl, fileUrl, fileType, fileSize, createdAt, downloadCount]
      properties:
        id: { type: integer }
        title: { type: string }
        author: { type: string }
        description: { type: string }
        category: { type: string }
        coverUrl: { type: ["string", "null"] }
        fileUrl: { type: ["string", "null"] }
        fileType: { type: string }
        fileSize: { type: integer }
        createdAt: { type: string, format: date-time }
        downloadCount: { type: integer }
        featured: { type: boolean }
    BookInput:
      type: object
      required: [title, author, description, category, fileType]
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        coverUrl: { type: ["string", "null"] }
        fileUrl: { type: ["string", "null"] }
        fileType: { type: string, enum: [PDF, EPUB, MOBI, TXT] }
        fileSize: { type: integer, minimum: 0 }
        featured: { type: boolean }
    BookUpdate:
      allOf:
        - $ref: "#/components/schemas/BookInput"
      required: []
    Video:
      type: object
      required: [id, title, description, category, thumbnailUrl, videoUrl, duration, createdAt, downloadEnabled, viewCount, downloadCount]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        videoUrl: { type: ["string", "null"] }
        duration: { type: string }
        createdAt: { type: string, format: date-time }
        downloadEnabled: { type: boolean }
        viewCount: { type: integer }
        downloadCount: { type: integer }
        featured: { type: boolean }
    VideoInput:
      type: object
      required: [title, description, category, duration]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        thumbnailUrl: { type: ["string", "null"] }
        videoUrl: { type: ["string", "null"] }
        duration: { type: string, minLength: 1 }
        downloadEnabled: { type: boolean }
        featured: { type: boolean }
    VideoUpdate:
      allOf:
        - $ref: "#/components/schemas/VideoInput"
      required: []
    Image:
      type: object
      required: [id, title, description, category, imageUrl, alt, createdAt, featured]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        imageUrl: { type: string }
        alt: { type: string }
        createdAt: { type: string, format: date-time }
        featured: { type: boolean }
    ImageInput:
      type: object
      required: [title, description, category, imageUrl, alt]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        imageUrl: { type: string, minLength: 1 }
        alt: { type: string, minLength: 1 }
        featured: { type: boolean }
    ImageUpdate:
      allOf:
        - $ref: "#/components/schemas/ImageInput"
      required: []
    Event:
      type: object
      required: [id, title, shortDescription, fullDescription, eventDate, startTime, endTime, timezone, startsAt, endsAt, imageId, imageUrl, venue, city, address, mapsUrl, externalUrl, published, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        shortDescription: { type: string }
        fullDescription: { type: string }
        eventDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        startTime: { type: string }
        endTime: { type: ["string", "null"] }
        timezone: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: ["string", "null"], format: date-time }
        imageId: { type: ["integer", "null"] }
        imageUrl: { type: ["string", "null"] }
        venue: { type: string }
        city: { type: string }
        address: { type: string }
        mapsUrl: { type: string, format: uri }
        externalUrl: { type: ["string", "null"], format: uri }
        published: { type: boolean }
        status: { type: string, enum: [draft, upcoming, past] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventInput:
      type: object
      required: [title, shortDescription, fullDescription, eventDate, startTime, venue, city, address, mapsUrl, published]
      properties:
        title: { type: string, minLength: 1 }
        shortDescription: { type: string, minLength: 1 }
        fullDescription: { type: string, minLength: 1 }
        eventDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        startTime: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        endTime: { type: ["string", "null"], pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        timezone: { type: string, default: Africa/Maputo }
        imageId: { type: ["integer", "null"] }
        venue: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        mapsUrl: { type: string, format: uri, minLength: 1 }
        externalUrl: { type: ["string", "null"], format: uri }
        published: { type: boolean, default: false }
    EventUpdate:
      allOf:
        - $ref: "#/components/schemas/EventInput"
      required: []
    Category:
      type: object
      required: [name, bookCount, videoCount]
      properties:
        name: { type: string }
        bookCount: { type: integer }
        videoCount: { type: integer }
    DownloadResponse:
      type: object
      required: [url]
      properties:
        url: { type: string }
    LibrarySummary:
      type: object
      required: [bookCount, videoCount, featuredBooks, featuredVideos, recentlyAdded]
      properties:
        bookCount: { type: integer }
        videoCount: { type: integer }
        featuredBooks:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        featuredVideos:
          type: array
          items: { $ref: "#/components/schemas/Video" }
        recentlyAdded:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Book"
              - $ref: "#/components/schemas/Video"
    AdminStats:
      type: object
      required: [bookCount, videoCount, totalDownloads, totalViews, categoryBreakdown]
      properties:
        bookCount: { type: integer }
        videoCount: { type: integer }
        totalDownloads: { type: integer }
        totalViews: { type: integer }
        categoryBreakdown:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    AdminPasswordInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 256, format: password }
    AdminAccessStatus:
      type: object
      required: [authorized]
      properties:
        authorized: { type: boolean }
    AnalyticsEventInput:
      type: object
      required: [visitorId, path]
      properties:
        visitorId: { type: string, minLength: 16, maxLength: 128 }
        path: { type: string, minLength: 1, maxLength: 240 }
        title: { type: string, maxLength: 160 }
        referrer: { type: string, maxLength: 300 }
        eventType: { type: string, enum: [pageview, content_view], default: pageview }
    AnalyticsPeriod:
      type: object
      required: [key, start, end]
      properties:
        key: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    AnalyticsSummary:
      type: object
      required: [bookCount, videoCount, imageCount, totalDownloads, totalVisitors, totalPageviews]
      properties:
        bookCount: { type: integer }
        videoCount: { type: integer }
        imageCount: { type: integer }
        totalDownloads: { type: integer }
        totalVisitors: { type: integer }
        totalPageviews: { type: integer }
    LiveVisitor:
      type: object
      required: [path, device, country, lastSeenAt]
      properties:
        path: { type: string }
        device: { type: string }
        country: { type: string }
        lastSeenAt: { type: string, format: date-time }
    TrafficPoint:
      type: object
      required: [date, visitors, pageviews]
      properties:
        date: { type: string, format: date }
        visitors: { type: integer }
        pageviews: { type: integer }
    DownloadLeader:
      type: object
      required: [title, downloads]
      properties:
        title: { type: string }
        downloads: { type: integer }
    DownloadAnalytics:
      type: object
      required: [total, today, week, month, leaders]
      properties:
        total: { type: integer }
        today: { type: integer }
        week: { type: integer }
        month: { type: integer }
        leaders:
          type: array
          items: { $ref: "#/components/schemas/DownloadLeader" }
    AnalyticsSegment:
      type: object
      required: [name, visitors]
      properties:
        name: { type: string }
        visitors: { type: integer }
    PopularContent:
      type: object
      required: [type, title, path, views]
      properties:
        type: { type: string }
        title: { type: string }
        path: { type: string }
        views: { type: integer }
    RecentActivity:
      type: object
      required: [type, title, createdAt]
      properties:
        type: { type: string }
        title: { type: string }
        createdAt: { type: string, format: date-time }
    AdminAnalytics:
      type: object
      required: [period, summary, liveVisitors, traffic, downloads, popularContent, trafficSources, devices, recentActivity]
      properties:
        period: { $ref: "#/components/schemas/AnalyticsPeriod" }
        summary: { $ref: "#/components/schemas/AnalyticsSummary" }
        liveVisitors:
          type: object
          required: [count, visitors]
          properties:
            count: { type: integer }
            visitors:
              type: array
              items: { $ref: "#/components/schemas/LiveVisitor" }
        traffic:
          type: array
          items: { $ref: "#/components/schemas/TrafficPoint" }
        downloads: { $ref: "#/components/schemas/DownloadAnalytics" }
        popularContent:
          type: array
          items: { $ref: "#/components/schemas/PopularContent" }
        trafficSources:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsSegment" }
        devices:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsSegment" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/RecentActivity" }
    UploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }

